const COLOR_PALETTE = [
  '#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c084fc','#ff922b',
  '#f06595','#20c997','#339af0','#845ef7','#e8590c','#0ca678',
];
const SKIN_TONES = ['#d4a574','#e8c4a0','#e0b090','#c49060','#f0d0b0'];
const HAIR_COLORS = ['#333','#8B0000','#654321','#2c2c2c','#1a1a3e','#4a2a6a','#8B4513'];

let AGENTS = [];

function buildAgents(config) {
  AGENTS = [];
  AGENTS.push({
    id: 'main', name: 'Main Agent',
    role: config.main?.role || '시니어 개발자',
    color: '#e94560', skin: '#d4a574', hair: '#333', shirt: '#e94560',
    isMain: true, keywords: ['main','메인','시니어'],
  });

  const allSubs = [...(config.subagents || []).map(a => ({ ...a, type: 'sub' }))];
  allSubs.forEach((agent, i) => {
    const color = COLOR_PALETTE[i % COLOR_PALETTE.length];
    const id = agent.role.toLowerCase()
      .replace(/\s*\(.+?\)\s*/g, ' ').trim()
      .replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    const roleWords = agent.role.toLowerCase().split(/[\s/()]+/).filter(w => w.length > 1);
    const descWords = (agent.description || '').toLowerCase()
      .split(/[,·\s/()]+/).filter(w => w.length > 2).slice(0, 8);
    AGENTS.push({
      id: id || `agent-${i}`, name: agent.role.replace(/\s*\(.+?\)/, '').trim(),
      role: agent.role, color,
      skin: SKIN_TONES[i % SKIN_TONES.length],
      hair: HAIR_COLORS[i % HAIR_COLORS.length],
      shirt: color, isMain: false,
      keywords: [...new Set([...roleWords, ...descWords])],
    });
  });
}

// ══════════════════════════════════════
// 세션 관리
// ══════════════════════════════════════
const sessions = new Map();
let activeSessionId = null;
class Session {
  constructor(id, name, path) {
    this.id = id;
    this.name = name || id;
    this.path = path || '';
    this.logs = [];
    this.stats = { tools: 0, agents: 0, startTime: Date.now() };
    this.agentStates = {};
    this.activeAgents = new Set();
    this.termId = null;
    this.term = null;
    this.fitAddon = null;
    this.termEl = null;
    this.isManual = false;
    this.claudeDetected = false;
    this.linkedHookSessionId = null;
    this.idleTimers = {};
    this.alarm = false;
    // 탭별 독립 오피스 뷰
    this.officeEl = null;       // 오피스 DOM 컨테이너
    this.agentElements = {};    // agentId → DOM refs
    this.monitorLogEl = null;   // 모니터링 로그 컨테이너
  }
}

// 훅 세션 ID → Interactive 세션 ID 매핑
const hookSessionLinks = new Map();

function findLinkedManualSession(hookSessionId) {
  // 이미 링크된 경우
  if (hookSessionLinks.has(hookSessionId)) {
    const manualId = hookSessionLinks.get(hookSessionId);
    if (sessions.has(manualId)) return sessions.get(manualId);
    hookSessionLinks.delete(hookSessionId);
  }
  // Claude가 감지된 Interactive 세션 찾기
  for (const [id, s] of sessions) {
    if (s.isManual && s.claudeDetected && !s.linkedHookSessionId) {
      hookSessionLinks.set(hookSessionId, id);
      s.linkedHookSessionId = hookSessionId;
      return s;
    }
  }
  // Claude가 감지된 Interactive 세션이 하나뿐이면 바로 연결
  const manualSessions = [...sessions.values()].filter(s => s.isManual && s.claudeDetected && !s.linkedHookSessionId);
  if (manualSessions.length === 1) {
    const s = manualSessions[0];
    hookSessionLinks.set(hookSessionId, s.id);
    s.linkedHookSessionId = hookSessionId;
    return s;
  }
  return null;
}

function getOrCreateSession(sessionId, name, path) {
  if (!sessions.has(sessionId)) {
    const session = new Session(sessionId, name, path);
    sessions.set(sessionId, session);
    createSessionOffice(session);
    if (!activeSessionId) switchSession(sessionId);
    else renderTabs();
  }
  const s = sessions.get(sessionId);
  if (name && name !== s.name) { s.name = name; renderTabs(); }
  if (path) s.path = path;
  return s;
}

function switchSession(id) {
  activeSessionId = id;
  clearTabAlarm(id);
  // 모든 세션 오피스 레이어 숨기기
  for (const [, s] of sessions) {
    if (s.officeEl) s.officeEl.style.display = 'none';
  }
  // 활성 세션 오피스 레이어 표시
  const session = sessions.get(id);
  if (session) {
    if (!session.officeEl) createSessionOffice(session);
    session.officeEl.style.display = '';
  }
  // 전역 오피스 요소 숨기기 (세션별 레이어가 대체)
  const globalGrid = document.getElementById('agentsGrid');
  const globalMsg = document.getElementById('emptyMsg');
  const globalSvg = document.getElementById('connections');
  if (globalGrid) globalGrid.style.display = 'none';
  if (globalMsg) globalMsg.style.display = 'none';
  if (globalSvg) globalSvg.style.display = 'none';

  renderTabs();
  renderActiveSession();
  switchTerminalToSession(id);
  updateOfficeVisibility();
}

function removeSession(id) {
  const session = sessions.get(id);
  if (session) {
    // 잔여 idleTimers 정리
    if (session.idleTimers) {
      Object.values(session.idleTimers).forEach(clearTimeout);
    }
    // 훅 세션 링크 정리
    if (session.linkedHookSessionId) {
      hookSessionLinks.delete(session.linkedHookSessionId);
    }
    destroySessionTerminal(session);
    destroySessionOffice(session);
  }
  sessions.delete(id);
  if (activeSessionId === id) {
    const first = sessions.keys().next().value;
    if (first) {
      switchSession(first);
    } else {
      activeSessionId = null;
      renderTabs();
    }
  } else {
    renderTabs();
  }
}

// ── Claude 감지 + 오피스 표시/숨김 ──
function detectClaude(session) {
  if (session.claudeDetected) return;
  session.claudeDetected = true;
  // Interactive 세션이면 기존 Monitoring 세션 병합
  if (session.isManual && !session.linkedHookSessionId) {
    for (const [id, s] of sessions) {
      if (!s.isManual && !hookSessionLinks.has(id)) {
        hookSessionLinks.set(id, session.id);
        session.linkedHookSessionId = id;
        // 로그, 상태 병합
        session.logs.push(...s.logs);
        Object.assign(session.agentStates, s.agentStates);
        for (const aid of s.activeAgents) session.activeAgents.add(aid);
        Object.assign(session.stats, s.stats);
        // Monitoring 세션 제거
        if (s.idleTimers) Object.values(s.idleTimers).forEach(clearTimeout);
        destroySessionOffice(s);
        sessions.delete(id);
        if (activeSessionId === id) activeSessionId = session.id;
        break;
      }
    }
  }
  showAgents(session);
  renderTabs();
}

function updateOfficeVisibility() {
  const session = sessions.get(activeSessionId);
  // Monitoring 세션은 항상 에이전트 표시
  if (session && (session.claudeDetected || !session.isManual)) {
    showAgents(session);
  } else {
    hideAgents(session);
  }
}

function showAgents(session) {
  session = session || sessions.get(activeSessionId);
  const grid = session?.officeGrid || document.getElementById('agentsGrid');
  const msg = session?.officeEmptyMsg || document.getElementById('emptyMsg');
  const svg = session?.officeSvg || document.getElementById('connections');
  if (!grid) return;
  if (grid.classList.contains('hidden')) {
    grid.classList.remove('hidden');
    if (msg) msg.classList.add('hidden');
    const agents = grid.querySelectorAll('.agent');
    agents.forEach((el, i) => {
      el.style.opacity = '0';
      setTimeout(() => {
        el.style.opacity = '';
        el.classList.add('entering');
        el.addEventListener('animationend', () => el.classList.remove('entering'), { once: true });
      }, i * 120);
    });
    setTimeout(() => {
      drawConnections(session);
      if (svg) svg.classList.add('visible');
    }, AGENTS.length * 120 + 100);
  }
}

function hideAgents(session) {
  session = session || sessions.get(activeSessionId);
  const grid = session?.officeGrid || document.getElementById('agentsGrid');
  const msg = session?.officeEmptyMsg || document.getElementById('emptyMsg');
  const svg = session?.officeSvg || document.getElementById('connections');
  if (grid) grid.classList.add('hidden');
  if (msg) msg.classList.remove('hidden');
  if (svg) svg.classList.remove('visible');
}

// ── 탭 렌더링 ──
function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  if (sessions.size === 0) {
    const newBtn = document.createElement('button');
    newBtn.className = 'tab-new';
    newBtn.textContent = '+ New';
    newBtn.onclick = () => createManualTab();
    bar.appendChild(newBtn);
    const empty = document.createElement('div');
    empty.className = 'tab-empty';
    empty.textContent = '세션 대기 중...';
    bar.appendChild(empty);
    return;
  }
  for (const [id, session] of sessions) {
    const tab = document.createElement('div');
    const isActive = id === activeSessionId;
    const hasActivity = session.activeAgents.size > 0;
    tab.className = `tab${isActive ? ' active' : ''}${session.alarm ? ' alarm' : hasActivity ? ' has-activity' : ''}`;
    tab.dataset.sessionId = id;
    const typeClass = session.isManual ? 'interactive' : 'monitoring';
    const typeIcon = session.isManual ? '▶' : '◉';
    const typeLabel = session.isManual ? 'Interactive' : 'Monitoring';
    tab.innerHTML = `<span class="tab-type ${typeClass}">${typeIcon} ${typeLabel}</span><span class="tab-name">${session.name}</span>`;
    if (session.isManual) {
      const closeBtn = document.createElement('span');
      closeBtn.className = 'tab-close';
      closeBtn.textContent = '×';
      closeBtn.onclick = (e) => { e.stopPropagation(); removeSession(id); };
      tab.appendChild(closeBtn);
    }
    tab.onclick = () => switchSession(id);
    bar.appendChild(tab);
  }
  const newBtn = document.createElement('button');
  newBtn.className = 'tab-new';
  newBtn.textContent = '+ New';
  newBtn.onclick = () => createManualTab();
  bar.appendChild(newBtn);
}

// ── 탭 완료 플래시 효과 ──
function flashTabDone(sessionId) {
  if (sessionId === activeSessionId) return;
  const session = sessions.get(sessionId);
  if (session) session.alarm = true;
  renderTabs();
}

function clearTabAlarm(sessionId) {
  const session = sessions.get(sessionId);
  if (session) session.alarm = false;
}

// ── 활성 세션 렌더링 ──
function renderActiveSession() {
  const session = sessions.get(activeSessionId);
  if (!session) return;
  for (const agent of AGENTS) {
    const saved = session.agentStates[agent.id];
    setAgentVisual(agent.id, saved?.state || 'idle', saved?.message, session);
  }
  requestAnimationFrame(() => drawConnections(session));
}

// ══════════════════════════════════════
// 에이전트 DOM
// ══════════════════════════════════════
function getAgentCenter(agentId, session) {
  const grid = session?.officeGrid || document.getElementById('agentsGrid');
  const el = grid?.querySelector(`#agent-${agentId}`) || document.getElementById(`agent-${agentId}`);
  if (!el || !grid) return null;
  const er = el.getBoundingClientRect();
  const gr = grid.getBoundingClientRect();
  return { x: er.left - gr.left + er.width / 2, y: er.top - gr.top + er.height / 2 };
}

function createAgentEl(agent) {
  const cell = document.createElement('div');
  cell.className = `cubicle-cell has-agent${agent.isMain ? ' is-main' : ''}`;
  cell.style.setProperty('--agent-color', agent.color);

  // 상단 악센트 라인 + 앰비언트 글로우
  cell.innerHTML = `
    <div class="cubicle-accent" style="background:${agent.color};"></div>
    <div class="cubicle-ambient" style="background:${agent.color};"></div>
  `;

  const el = document.createElement('div');
  el.className = `agent ${agent.isMain ? 'main' : ''}`;
  el.id = `agent-${agent.id}`;
  el.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;';

  const code = 'const r=await fetch()\nif(ok){return data}\nvalidate()\ncheck(token)\nrender(<App/>)\noptimize()';
  const charWrap = document.createElement('div');
  charWrap.className = 'character';
  const charImg = createPixelCharacter(agent.skin, agent.hair, agent.shirt, agent.isMain ? 4 : 3, agent.id, agent.isMain);
  charImg.className = 'pixel-char idle';
  charImg.id = `char-${agent.id}`;
  charWrap.appendChild(charImg);

  const bubbleColor = agent.color;
  el.innerHTML = `<div class="speech-bubble" id="bubble-${agent.id}" style="border-color:${bubbleColor};">대기 중</div>`;
  el.querySelector('.speech-bubble').style.setProperty('--bubble-color', bubbleColor);
  el.appendChild(charWrap);

  const rest = document.createElement('div');
  rest.className = 'desk-area';
  const glowColor = agent.isMain ? 'rgba(255,77,109,0.25)' : `color-mix(in srgb, ${agent.color} 25%, transparent)`;
  rest.innerHTML = `
    <div class="desk">
      <div class="monitor" style="--glow-color:${glowColor};">
        <div class="monitor-screen" id="screen-${agent.id}">${code}</div>
        <div class="monitor-glow"></div>
      </div>
      <div class="keyboard" id="kbd-${agent.id}"></div>
      <div class="coffee-cup"><div class="steam" id="steam-${agent.id}"></div></div>
    </div>
    <div class="chair"></div>
    <div class="role-label" style="color:${agent.color};border-color:color-mix(in srgb, ${agent.color} 25%, transparent)">${agent.name}</div>
    <div class="status-indicator">
      <div class="status-dot" id="dot-${agent.id}" style="background:#484f58"></div>
      <span class="status-text" id="status-${agent.id}">IDLE</span>
    </div>`;
  el.appendChild(rest);
  cell.appendChild(el);
  return cell;
}

function drawConnections(session) {
  session = session || sessions.get(activeSessionId);
  const svg = session?.officeSvg || document.getElementById('connections');
  const grid = session?.officeGrid || document.getElementById('agentsGrid');
  if (!grid || !svg) return;
  const gr = grid.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${gr.width} ${gr.height}`);
  svg.innerHTML = '';
  const mc = getAgentCenter('main', session);
  if (!mc) return;
  for (const agent of AGENTS) {
    if (agent.isMain) continue;
    const ac = getAgentCenter(agent.id, session);
    if (!ac) continue;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', mc.x); line.setAttribute('y1', mc.y);
    line.setAttribute('x2', ac.x); line.setAttribute('y2', ac.y);
    line.classList.add('connection-line');
    line.setAttribute('stroke', agent.color);
    line.id = `line-${agent.id}`;
    svg.appendChild(line);
  }
}

// ── 에이전트 상태 (세션 기반) ──
function updateAgentState(sessionId, agentId, state, message) {
  const session = sessions.get(sessionId);
  if (!session) return;
  session.agentStates[agentId] = { state, message: message || '' };
  if (state === 'working') session.activeAgents.add(agentId);
  else session.activeAgents.delete(agentId);

  // 해당 세션의 오피스 DOM에 직접 반영
  setAgentVisual(agentId, state, message, session);
  renderTabs();

  // done→idle 타이머: 기존 타이머 취소 후 재등록
  if (session.idleTimers[agentId]) {
    clearTimeout(session.idleTimers[agentId]);
    delete session.idleTimers[agentId];
  }

  if (state === 'done') {
    const delay = session.activeAgents.size > 0 ? 18000 : 8000;
    session.idleTimers[agentId] = setTimeout(() => {
      delete session.idleTimers[agentId];
      const s = sessions.get(sessionId);
      if (s && !s.activeAgents.has(agentId)) {
        // 동적 에이전트(dyn-)는 idle 전환 대신 완전 제거
        if (agentId.startsWith('dyn-')) {
          removeDynamicAgent(agentId);
        } else {
          updateAgentState(sessionId, agentId, 'idle');
        }
      }
    }, delay);
  }
}

function setAgentVisual(agentId, state, message, session) {
  const agent = AGENTS.find(a => a.id === agentId);
  if (!agent) return;
  const root = session?.officeGrid || document.getElementById('agentsGrid');
  if (!root) return;
  const dot = root.querySelector(`#dot-${agentId}`);
  const statusText = root.querySelector(`#status-${agentId}`);
  const screen = root.querySelector(`#screen-${agentId}`);
  const bubble = root.querySelector(`#bubble-${agentId}`);
  const line = (session?.officeSvg || document.getElementById('connections'))?.querySelector(`#line-${agentId}`);
  const el = root.querySelector(`#agent-${agentId}`);
  const charCanvas = root.querySelector(`#char-${agentId}`);
  const kbd = root.querySelector(`#kbd-${agentId}`);
  const steam = root.querySelector(`#steam-${agentId}`);
  if (!dot) return;

  // 큐비클 셀에 working 클래스 토글
  const cell = el?.closest('.cubicle-cell');

  if (state === 'working') {
    dot.style.background = agent.color;
    statusText.textContent = 'WORKING'; statusText.style.color = agent.color;
    screen.classList.add('active');
    if (line) line.classList.add('active');
    el.classList.add('speaking');
    charCanvas.className = 'pixel-char working';
    if (kbd) kbd.classList.add('typing');
    if (steam) steam.classList.add('visible');
    if (cell) cell.classList.add('working');
    if (message) bubble.textContent = message;
  } else if (state === 'done') {
    dot.style.background = '#6bcb77';
    statusText.textContent = 'DONE'; statusText.style.color = '#6bcb77';
    screen.classList.remove('active');
    if (line) line.classList.remove('active');
    el.classList.add('speaking');
    charCanvas.className = 'pixel-char idle';
    if (kbd) kbd.classList.remove('typing');
    if (steam) steam.classList.remove('visible');
    if (cell) cell.classList.remove('working');
    if (message) bubble.textContent = message;
  } else {
    dot.style.background = '#484f58';
    statusText.textContent = 'IDLE'; statusText.style.color = '#6e7681';
    screen.classList.remove('active');
    if (line) line.classList.remove('active');
    el.classList.remove('speaking');
    charCanvas.className = 'pixel-char idle';
    if (kbd) kbd.classList.remove('typing');
    if (steam) steam.classList.remove('visible');
    if (cell) cell.classList.remove('working');
  }
}

// ══════════════════════════════════════
// 파티클
// ══════════════════════════════════════
function emitParticles(fromId, toId, color, session) {
  session = session || sessions.get(activeSessionId);
  const fc = getAgentCenter(fromId, session);
  const tc = getAgentCenter(toId, session);
  if (!fc || !tc) return;
  const office = document.getElementById('office');
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'particle'; p.style.background = color;
      p.style.left = fc.x+'px'; p.style.top = fc.y+'px';
      office.appendChild(p);
      p.animate([
        { left: fc.x+'px', top: fc.y+'px', opacity: 1, transform: 'scale(1)' },
        { left: tc.x+'px', top: tc.y+'px', opacity: 0, transform: 'scale(0.2)' }
      ], { duration: 600+Math.random()*200, fill: 'forwards' }).onfinish = () => p.remove();
    }, i * 80);
  }
}

// ══════════════════════════════════════
// 로그 (세션 기반)
// ══════════════════════════════════════
function addLog(sessionId, agentName, color, message, toolName, detail, detailType) {
  const session = sessions.get(sessionId);
  if (!session) return;
  const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
  const log = { time, agentName, color, message, toolName, detail, detailType };
  session.logs.push(log);
  // 메모리 관리: 로그 상한 1000개
  if (session.logs.length > 1000) session.logs.splice(0, session.logs.length - 1000);
  if (sessionId === activeSessionId && !session.isManual) {
    appendMonitorLogEntry(log, false);
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function simpleMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>');
  html = html.replace(/^\|(.+)\|$/gm, (match, content) => {
    const cells = content.split('|').map(c => c.trim());
    if (cells.every(c => /^[-:]+$/.test(c))) return '';
    const tag = cells.some(c => /^[-:]+$/.test(c)) ? 'th' : 'td';
    return '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
  });
  html = html.replace(/(<tr>[\s\S]*?<\/tr>)/g, '<table>$1</table>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
  html = html.replace(/\n/g, '<br>');
  html = html.replace(/<br><h/g, '<h').replace(/<\/h(\d)><br>/g, '</h$1>');
  html = html.replace(/<br><pre>/g, '<pre>').replace(/<\/pre><br>/g, '</pre>');
  html = html.replace(/<br><ul>/g, '<ul>').replace(/<\/ul><br>/g, '</ul>');
  html = html.replace(/<br><hr>/g, '<hr>').replace(/<hr><br>/g, '<hr>');
  html = html.replace(/<br><table>/g, '<table>').replace(/<\/table><br>/g, '</table>');
  return html;
}

// ══════════════════════════════════════
// 서브에이전트 매칭
// ══════════════════════════════════════
function matchSubagent(event) {
  const desc = (event.description || event.prompt || '').toLowerCase();
  let bestMatch = null, bestScore = 0;
  for (const agent of AGENTS) {
    if (agent.isMain) continue;
    const score = agent.keywords.reduce((s, kw) => s + (desc.includes(kw) ? 1 : 0), 0);
    if (score > bestScore) { bestScore = score; bestMatch = agent.id; }
  }
  return bestScore > 0 ? bestMatch : null;
}

// 동적 서브에이전트 생성 — CLAUDE.md 정의 없어도 Agent 도구 호출 시 자동 등록
let dynAgentCounter = 0;

// PreToolUse→PostToolUse 매핑: description→agentId
const pendingAgentMap = new Map();

function findDynamicAgent(toolInput) {
  // PostToolUse/SubagentStart/Stop에서 기존 에이전트 찾기
  const key = toolInput.description || toolInput.subagent_type || '';
  if (pendingAgentMap.has(key)) return pendingAgentMap.get(key);
  // fallback: working 상태인 같은 타입 에이전트 찾기
  const type = (toolInput.subagent_type || 'general-purpose').toLowerCase();
  const found = AGENTS.find(a => a.id.startsWith('dyn-') && a.keywords?.includes(type));
  return found?.id || null;
}

function ensureDynamicAgent(toolInput) {
  const type = toolInput.subagent_type || 'general-purpose';
  const desc = toolInput.description || type;

  // description 기반으로 이미 생성된 에이전트가 있으면 재사용
  const key = desc || type;
  if (pendingAgentMap.has(key)) return pendingAgentMap.get(key);

  // 새 인스턴스 생성 (같은 타입이라도 별도 큐비클)
  dynAgentCounter++;
  const id = 'dyn-' + dynAgentCounter;

  const idx = AGENTS.filter(a => !a.isMain).length;
  const color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
  const nameMap = {
    'general-purpose': 'General Agent',
    'Explore': 'Explorer',
    'Plan': 'Planner',
    'claude-code-guide': 'Guide Agent',
  };

  AGENTS.push({
    id,
    name: nameMap[type] || type,
    role: desc,
    color,
    skin: SKIN_TONES[idx % SKIN_TONES.length],
    hair: HAIR_COLORS[idx % HAIR_COLORS.length],
    shirt: color,
    isMain: false,
    keywords: [type.toLowerCase(), ...desc.toLowerCase().split(/[\s/()]+/).filter(w => w.length > 1)],
  });

  // 모든 세션의 오피스 그리드 재렌더링
  for (const [, s] of sessions) {
    if (s.officeGrid) {
      renderOfficeForContainer(s.officeGrid);
      // 이미 Claude 감지된 세션이면 에이전트 보이게
      if (s.claudeDetected) {
        s.officeGrid.classList.remove('hidden');
        if (s.officeEmptyMsg) s.officeEmptyMsg.classList.add('hidden');
      }
      // 기존 에이전트 상태 복원
      for (const [aid, st] of Object.entries(s.agentStates)) {
        setAgentVisual(aid, st.state, st.message, s);
      }
      drawConnections(s);
    }
  }

  // Pre→Post 매핑 등록
  pendingAgentMap.set(key, id);

  console.log(`[DYNAMIC] 서브에이전트 추가: ${id} (${type})`);
  return id;
}

// 동적 서브에이전트 제거 — done 후 일정 시간 뒤 큐비클에서 완전 퇴근
function removeDynamicAgent(agentId) {
  const idx = AGENTS.findIndex(a => a.id === agentId);
  if (idx === -1) return;
  AGENTS.splice(idx, 1);
  releaseAgentSprite(agentId);
  pendingAgentMap.forEach((v, k) => { if (v === agentId) pendingAgentMap.delete(k); });

  // 모든 세션에서 해당 에이전트 상태 정리 + 그리드 재렌더링
  for (const [, s] of sessions) {
    delete s.agentStates[agentId];
    s.activeAgents.delete(agentId);
    if (s.officeGrid) {
      renderOfficeForContainer(s.officeGrid);
      if (s.claudeDetected) {
        s.officeGrid.classList.remove('hidden');
        if (s.officeEmptyMsg) s.officeEmptyMsg.classList.add('hidden');
      }
      // 남은 에이전트 상태 복원
      for (const [aid, st] of Object.entries(s.agentStates)) {
        setAgentVisual(aid, st.state, st.message, s);
      }
      drawConnections(s);
    }
  }
  console.log(`[DYNAMIC] 서브에이전트 제거: ${agentId}`);
}

// ══════════════════════════════════════
// Hook 이벤트 처리
// ══════════════════════════════════════
function handleHookEvent(event) {
  const hookSid = event.session_id || 'default';
  // Interactive 세션에 연결 시도
  const linked = findLinkedManualSession(hookSid);
  const sid = linked ? linked.id : hookSid;
  const session = linked || getOrCreateSession(hookSid, event.project_name, event.project_path);
  const isActive = sid === activeSessionId;

  // Hook 이벤트가 들어오면 Claude가 실행 중인 것
  if (!session.claudeDetected) detectClaude(session);

  const eventName = event.hook_event_name;
  const toolName = event.tool_name || '';
  const toolInput = event.tool_input || {};

  switch (eventName) {
    case 'SessionStart':
      addLog(sid, 'System', '#e94560', `세션 시작 (${event.source || 'startup'})`, null);
      updateAgentState(sid, 'main', 'working', '세션 시작됨');
      session.stats.startTime = Date.now();
      break;

    case 'PreToolUse':
      session.stats.tools++;
      if (toolName === 'Agent') {
        // subagent_type이 있으면 동적 생성 우선, 없으면 CLAUDE.md 키워드 매칭
        let subId = toolInput.subagent_type ? ensureDynamicAgent(toolInput) : (matchSubagent(toolInput) || ensureDynamicAgent(toolInput));
        session.stats.agents++;
        updateAgentState(sid, subId, 'working', toolInput.description || '작업 시작...');
        emitParticles('main', subId, AGENTS.find(a=>a.id===subId)?.color || '#e94560', session);
        const a = AGENTS.find(a=>a.id===subId);
        addLog(sid, a?.name||subId, a?.color||'#fff', toolInput.description||'서브에이전트 시작', 'Agent', toolInput.prompt?.substring(0, 300));
      } else {
        updateAgentState(sid, 'main', 'working', `${toolName} 실행 중...`);
        let summary = '';
        let detail = '';
        switch (toolName) {
          case 'Bash': summary = toolInput.description || toolInput.command?.substring(0, 80) || 'Bash'; detail = toolInput.command || ''; break;
          case 'Read': summary = toolInput.file_path?.split('/').pop() || 'Read'; detail = toolInput.file_path || ''; break;
          case 'Edit': summary = toolInput.file_path?.split('/').pop() || 'Edit'; detail = toolInput.file_path || ''; break;
          case 'Write': summary = toolInput.file_path?.split('/').pop() || 'Write'; detail = toolInput.file_path || ''; break;
          case 'Grep': summary = `패턴: ${toolInput.pattern || ''}`; detail = toolInput.pattern ? `pattern: ${toolInput.pattern}${toolInput.path ? '\npath: '+toolInput.path : ''}` : ''; break;
          case 'Glob': summary = toolInput.pattern || 'Glob'; detail = toolInput.pattern || ''; break;
          default: summary = toolName;
        }
        addLog(sid, 'Main Agent', '#e94560', summary, toolName, detail);
      }
      break;

    case 'PostToolUse': {
      const toolOutput = event.tool_response || event.tool_output || '';
      if (toolName === 'Agent') {
        let subId = findDynamicAgent(toolInput) || matchSubagent(toolInput) || ensureDynamicAgent(toolInput);
        // 완료 시 pendingAgentMap에서 제거
        const mapKey = toolInput.description || toolInput.subagent_type || '';
        pendingAgentMap.delete(mapKey);
        // 백그라운드 에이전트는 PostToolUse가 즉시 오므로, 응답에 "background" 포함 시 working 유지
        const outputStr = typeof toolOutput === 'string' ? toolOutput : JSON.stringify(toolOutput || '');
        const isBackground = outputStr.includes('background') || outputStr.includes('Async');
        if (isBackground) {
          updateAgentState(sid, subId, 'working', '백그라운드 작업 중...');
        } else {
          updateAgentState(sid, subId, 'done', '작업 완료');
          emitParticles(subId, 'main', '#6bcb77', session);
        }
      } else {
        updateAgentState(sid, 'main', 'working', `${toolName} 완료`);
      }
      if (toolOutput) {
        const outputStr = typeof toolOutput === 'string' ? toolOutput : JSON.stringify(toolOutput, null, 2);
        if (outputStr.trim()) {
          const isError = event.tool_error || outputStr.includes('Error') || outputStr.includes('error:');
          addLog(sid, 'Main Agent', '#e94560', `${toolName} 완료`, null, outputStr, isError ? 'error' : 'output');
        }
      }
      break;
    }

    case 'SubagentStart': {
      let subId = findDynamicAgent({ description: event.agent_type || '', subagent_type: event.agent_type }) || matchSubagent({ description: event.agent_type || '' });
      if (!subId) subId = ensureDynamicAgent({ subagent_type: event.agent_type || 'general-purpose', description: event.agent_type || '' });
      updateAgentState(sid, subId, 'working', `${event.agent_type || 'Agent'} 시작`);
      emitParticles('main', subId, AGENTS.find(a=>a.id===subId)?.color || '#e94560', session);
      break;
    }

    case 'SubagentStop': {
      let subId = findDynamicAgent({ description: event.agent_type || '', subagent_type: event.agent_type }) || matchSubagent({ description: event.agent_type || '' });
      if (!subId) subId = ensureDynamicAgent({ subagent_type: event.agent_type || 'general-purpose', description: event.agent_type || '' });
      updateAgentState(sid, subId, 'done', '작업 완료!');
      emitParticles(subId, 'main', '#6bcb77', session);
      const a = AGENTS.find(a=>a.id===subId);
      addLog(sid, a?.name||subId, a?.color||'#6bcb77', '작업 완료', null);
      break;
    }

    case 'Stop':
      addLog(sid, 'Main Agent', '#6bcb77', '응답 완료', null);
      setTimeout(() => {
        if (session.activeAgents.size === 0) updateAgentState(sid, 'main', 'done', '작업 완료');
        flashTabDone(sid);
      }, 500);
      break;

    case 'Notification':
      addLog(sid, 'System', '#ffd93d', event.notification_message || 'Notification', null);
      break;

    default:
      addLog(sid, 'System', '#888', eventName, toolName || null);
  }
}

// ══════════════════════════════════════
// 트랜스크립트 이벤트 처리
// ══════════════════════════════════════
function handleTranscriptEvent(data) {
  const hookSid = data.session_id || 'default';
  const linked = findLinkedManualSession(hookSid);
  const sid = linked ? linked.id : hookSid;
  const session = linked || getOrCreateSession(hookSid);

  switch (data.entry_type) {
    case 'user': {
      // 백그라운드 에이전트 완료 감지 (task-notification)
      const text = data.text || '';
      if (text.includes('task-notification') && text.includes('completed')) {
        const summaryMatch = text.match(/<summary>(.*?)<\/summary>/);
        if (summaryMatch) {
          let subId = matchSubagent({ description: summaryMatch[1] });
          if (!subId) subId = ensureDynamicAgent({ description: summaryMatch[1] });
          updateAgentState(sid, subId, 'done', '작업 완료!');
          const a = AGENTS.find(a => a.id === subId);
          addLog(sid, a?.name || subId, a?.color || '#6bcb77', '작업 완료', null);
        }
      }
      addLog(sid, '👤 User', '#ffd93d', '', null, text, 'user-input');
      break;
    }
    case 'assistant':
      for (const part of data.parts || []) {
        if (part.type === 'text') {
          addLog(sid, '🤖 Claude', '#4d96ff', '', null, part.text, 'assistant-text');
        }
      }
      break;
    case 'tool_result':
      if (data.text) {
        addLog(sid, 'Main Agent', '#e94560', '도구 결과', null, data.text, 'output');
      }
      break;
  }
}

// ══════════════════════════════════════
// WebSocket
// ══════════════════════════════════════
let ws;
function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}`);

  ws.onopen = () => {
    document.getElementById('wsStatus').textContent = 'CONNECTED';
    document.getElementById('wsStatus').className = 'ws-status connected';
    if (sessions.size === 0) createManualTab();
  };

  ws.onclose = () => {
    document.getElementById('wsStatus').textContent = 'DISCONNECTED';
    document.getElementById('wsStatus').className = 'ws-status disconnected';
    setTimeout(connectWS, 2000);
  };

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      switch (data.type) {
        case 'init': {
          // 서버에 없는 외부 세션만 제거, 기존 세션은 로그 보존하며 업데이트
          const serverIds = new Set((data.sessions || []).map(s => s.id));
          const toRemove = [];
          for (const [id, s] of sessions) {
            if (!s.isManual && !serverIds.has(id)) toRemove.push(id);
          }
          toRemove.forEach(id => removeSession(id));
          for (const s of data.sessions || []) {
            getOrCreateSession(s.id, s.name, s.path);
          }
          break;
        }
        case 'hook':
          handleHookEvent(data);
          break;
        case 'transcript':
          handleTranscriptEvent(data);
          break;
        case 'session_new': {
          const linked = findLinkedManualSession(data.session.id);
          if (!linked) {
            getOrCreateSession(data.session.id, data.session.name, data.session.path);
          }
          break;
        }
        case 'session_removed':
          removeSession(data.session_id);
          break;
        case 'terminal_output': {
          const ts = findSessionByTermId(data.id);
          if (ts?.term) {
            ts.term.write(data.data);
            // Claude 실행 감지: 터미널 출력에서 시그니처 확인
            if (!ts.claudeDetected && data.data.match(/claude\s|Claude Code|╭─/i)) {
              detectClaude(ts);
            }
          }
          break;
        }
        case 'terminal_ready':
          console.log('[TERMINAL] 준비 완료:', data.id);
          break;
        case 'terminal_exit': {
          const exitSession = findSessionByTermId(data.id);
          if (exitSession?.term) exitSession.term.write('\r\n\x1b[90m[프로세스 종료]\x1b[0m\r\n');
          break;
        }
      }
    } catch {}
  };
}

// ══════════════════════════════════════
// 오피스 그리드 렌더링 — 세션별 독립
// ══════════════════════════════════════
function renderOffice() {
  // 전역 오피스 렌더 (초기화용, 첫 세션 생성 전)
  renderOfficeForContainer(document.getElementById('agentsGrid'));
}

function renderOfficeForContainer(grid) {
  grid.innerHTML = '';
  const cols = 3;
  const subs = AGENTS.filter(a => !a.isMain);
  const main = AGENTS.find(a => a.isMain);
  const totalCells = Math.max(subs.length + 1, 9);
  const rows = Math.ceil(totalCells / cols);
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

  // 메인은 가운데(1,1), 서브는 나머지 칸에 순서대로 배치
  // 3x3: [00,01,02,10,  11(main)  ,12,20,21,22]
  // 서브 배치 순서: 00→01→02→10→12→20→21→22 (11=메인 제외)
  const centerIdx = Math.floor(rows / 2) * cols + Math.floor(cols / 2);

  // 서브에이전트가 배치될 인덱스 목록 (센터 제외)
  const subSlots = [];
  for (let i = 0; i < rows * cols; i++) {
    if (i !== centerIdx) subSlots.push(i);
  }

  // 배치 맵: index → agent
  const cellMap = new Map();
  cellMap.set(centerIdx, main);
  for (let si = 0; si < subs.length && si < subSlots.length; si++) {
    cellMap.set(subSlots[si], subs[si]);
  }

  for (let i = 0; i < rows * cols; i++) {
    const agent = cellMap.get(i);
    if (agent) {
      grid.appendChild(createAgentEl(agent));
    } else {
      const empty = document.createElement('div');
      empty.className = 'cubicle-cell empty-cell';
      empty.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0.2;">
        <div style="text-align:center;">
          <div style="width:60px;height:18px;background:linear-gradient(180deg,#2a2e3a,#1e222c);border:1px solid #333;border-radius:2px;margin:0 auto;"></div>
          <div style="width:8px;height:4px;background:#2a2e3a;margin:0 auto;"></div>
        </div>
      </div>`;
      grid.appendChild(empty);
    }
  }
}

// 세션별 오피스 오버레이 생성 (에이전트 그리드 + 연결선 + 빈 메시지)
function createSessionOffice(session) {
  const container = document.createElement('div');
  container.className = 'session-office-layer';
  container.id = `office-layer-${session.id}`;
  container.style.cssText = 'position:absolute;inset:0;z-index:5;display:none;';

  // 빈 사무실 메시지
  const emptyMsg = document.createElement('div');
  emptyMsg.className = 'empty-office-msg';
  emptyMsg.innerHTML = `<div class="msg">
    아직 아무도 출근하지 않았습니다<br><br>
    터미널에서 claude 를 실행하면<br>
    에이전트들이 출근합니다<br><br>
    <span style="font-size:12px;color:#aaa;">Tip: 터미널에 claude 를 입력하세요</span>
  </div>`;
  container.appendChild(emptyMsg);

  // 연결선 SVG
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'connections');
  container.appendChild(svg);

  // 에이전트 그리드
  const grid = document.createElement('div');
  grid.className = 'agents-grid hidden';
  renderOfficeForContainer(grid);
  container.appendChild(grid);

  // 세션에 DOM 참조 저장
  session.officeEl = container;
  session.officeGrid = grid;
  session.officeSvg = svg;
  session.officeEmptyMsg = emptyMsg;

  document.getElementById('office').appendChild(container);
  return container;
}

function destroySessionOffice(session) {
  if (session.officeEl) {
    session.officeEl.remove();
    session.officeEl = null;
    session.officeGrid = null;
    session.officeSvg = null;
    session.officeEmptyMsg = null;
  }
}

// ══════════════════════════════════════
// 터미널 검색
// ══════════════════════════════════════
function initTerminalSearch() {
  const bar = document.getElementById('termSearchBar');
  const input = document.getElementById('termSearchInput');
  const prevBtn = document.getElementById('termSearchPrev');
  const nextBtn = document.getElementById('termSearchNext');
  const closeBtn = document.getElementById('termSearchClose');

  function toggleSearch() {
    const session = sessions.get(activeSessionId);
    if (!session?.searchAddon) return;
    if (bar.classList.contains('visible')) {
      bar.classList.remove('visible');
      session.searchAddon.clearDecorations();
      if (session.term) session.term.focus();
    } else {
      bar.classList.add('visible');
      input.focus();
      input.select();
    }
  }

  function doSearch(direction) {
    const session = sessions.get(activeSessionId);
    if (!session?.searchAddon || !input.value) return;
    if (direction === 'prev') {
      session.searchAddon.findPrevious(input.value);
    } else {
      session.searchAddon.findNext(input.value);
    }
  }

  // Ctrl+F → 검색 토글
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
      const session = sessions.get(activeSessionId);
      if (session?.isManual && session?.term) {
        e.preventDefault();
        toggleSearch();
      }
    }
    if (e.key === 'Escape' && bar.classList.contains('visible')) {
      toggleSearch();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      doSearch(e.shiftKey ? 'prev' : 'next');
    }
  });
  input.addEventListener('input', () => doSearch('next'));
  prevBtn.addEventListener('click', () => doSearch('prev'));
  nextBtn.addEventListener('click', () => doSearch('next'));
  closeBtn.addEventListener('click', () => toggleSearch());
}

// ══════════════════════════════════════
// 초기화
// ══════════════════════════════════════
async function init() {
  try {
    const res = await fetch('/api/agents');
    const config = await res.json();
    buildAgents(config);
  } catch {
    buildAgents({ main: { role: '시니어 개발자' }, subagents: [] });
  }
  renderFurniture();
  renderOffice();
  initDustParticles();
  initTerminalSearch();
  connectWS();
}

// 브라우저 종료/새로고침 시 WebSocket 즉시 닫기 → 서버가 PTY 정리
window.addEventListener('beforeunload', () => {
  if (ws) ws.close();
});

window.addEventListener('resize', () => {
  const activeSession = sessions.get(activeSessionId);
  requestAnimationFrame(() => drawConnections(activeSession));
  if (activeSession?.fitAddon) activeSession.fitAddon.fit();
});

// ── 파일 드래그앤드롭 → 터미널에 경로 삽입 ──
// ── 파일 드래그앤드롭 → 터미널에 경로 삽입 ──
function shellQuote(path) {
  return "'" + path.replace(/'/g, "'\\''") + "'";
}

const termPanel = document.querySelector('.right-panel');
termPanel.addEventListener('dragover', (e) => {
  e.preventDefault();
  const session = sessions.get(activeSessionId);
  if (session?.term && session.isManual) {
    termPanel.classList.add('drop-highlight');
  }
});
termPanel.addEventListener('dragleave', (e) => {
  if (!termPanel.contains(e.relatedTarget)) {
    termPanel.classList.remove('drop-highlight');
  }
});
termPanel.addEventListener('drop', (e) => {
  e.preventDefault();
  termPanel.classList.remove('drop-highlight');
  const session = sessions.get(activeSessionId);
  if (!session?.term || !session.isManual) return;

  // macOS Finder 드래그 시 file:// URI에서 경로 추출
  const uri = e.dataTransfer.getData('text/uri-list');
  if (uri) {
    const paths = uri.split('\n')
      .filter(l => l.startsWith('file://'))
      .map(l => {
        try { return decodeURIComponent(new URL(l.trim()).pathname); }
        catch { return null; }
      })
      .filter(Boolean);
    if (paths.length > 0) {
      const input = paths.map(shellQuote).join(' ');
      session.term.paste(input);
      return;
    }
  }

  // fallback: File 객체를 서버에 업로드 → 전체 경로 획득 (Windows 등)
  const files = e.dataTransfer.files;
  if (files.length > 0) {
    const formData = new FormData();
    for (const f of files) formData.append('files', f, f.name);
    fetch('/api/upload', { method: 'POST', body: formData })
      .then(r => r.json())
      .then(data => {
        if (data.paths?.length) {
          const input = data.paths.map(shellQuote).join(' ');
          session.term.paste(input);
        }
      })
      .catch(() => {
        // 업로드 실패 시 파일명만 삽입
        const names = Array.from(files).map(f => shellQuote(f.name)).join(' ');
        session.term.paste(names);
      });
  }
});

// ══════════════════════════════════════
// 모니터링 로그 (외부 세션용)
// ══════════════════════════════════════
function renderMonitorLog(session) {
  const panel = document.getElementById('monitorLogContent');
  if (!panel) return;
  panel.innerHTML = '';
  for (const log of session.logs) appendMonitorLogEntry(log, true);
  requestAnimationFrame(() => { panel.scrollTop = panel.scrollHeight; });
}

function appendMonitorLogEntry(log, noAnim) {
  const panel = document.getElementById('monitorLogContent');
  if (!panel) return;
  const entry = document.createElement('div');
  entry.className = `log-entry${noAnim ? ' no-anim' : ''}`;
  const toolTag = log.toolName ? `<span class="log-tool">[${log.toolName}]</span>` : '';
  let html = `<div class="log-entry-header">
    <span class="log-time">${log.time}</span>
    <span class="log-agent" style="color:${log.color}">${log.agentName}</span>
    ${toolTag}
    <span class="log-msg">${escapeHtml(log.message)}</span>
  </div>`;
  if (log.detail) {
    if (log.detailType === 'assistant-text') {
      html += `<div class="log-chat">${simpleMarkdown(log.detail)}</div>`;
    } else {
      const cls = log.detailType === 'output' ? ' output' : log.detailType === 'error' ? ' error' : '';
      html += `<div class="log-detail${cls}">${escapeHtml(log.detail)}</div>`;
    }
  }
  entry.innerHTML = html;
  panel.appendChild(entry);
  // DOM 노드 상한: 메모리 배열과 동일하게 1000개 유지
  while (panel.children.length > 1000) {
    panel.removeChild(panel.firstChild);
  }
  if (!noAnim) {
    requestAnimationFrame(() => { panel.scrollTop = panel.scrollHeight; });
  }
}

// ══════════════════════════════════════
// 터미널 (xterm.js) — 세션별 독립 터미널
// ══════════════════════════════════════
let xtermModules = null;
let termCounter = 0;

async function loadXtermModules() {
  if (xtermModules) return xtermModules;
  const [{ Terminal }, { FitAddon }, { WebLinksAddon }, { SearchAddon }] = await Promise.all([
    import('/node_modules/@xterm/xterm/lib/xterm.mjs'),
    import('/node_modules/@xterm/addon-fit/lib/addon-fit.mjs'),
    import('/node_modules/@xterm/addon-web-links/lib/addon-web-links.mjs'),
    import('/node_modules/@xterm/addon-search/lib/addon-search.mjs'),
  ]);
  xtermModules = { Terminal, FitAddon, WebLinksAddon, SearchAddon };
  return xtermModules;
}

async function createSessionTerminal(session) {
  if (session.term) return;
  const { Terminal, FitAddon, WebLinksAddon, SearchAddon } = await loadXtermModules();
  const id = 'term-' + (++termCounter);
  session.termId = id;

  const term = new Terminal({
    fontFamily: "'Courier New', monospace",
    fontSize: 13,
    theme: {
      background: '#0a0a16', foreground: '#c8d6e5', cursor: '#e94560',
      selectionBackground: '#264f78',
      black: '#1a1a2e', red: '#e94560', green: '#6bcb77',
      yellow: '#ffd93d', blue: '#4d96ff', magenta: '#c084fc',
      cyan: '#20c997', white: '#c8d6e5',
      brightBlack: '#555', brightRed: '#ff6b6b', brightGreen: '#85e89d',
      brightYellow: '#ffe066', brightBlue: '#79b8ff', brightMagenta: '#d2a8ff',
      brightCyan: '#56d4dd', brightWhite: '#ffffff',
    },
    cursorBlink: true, allowProposedApi: true,
  });

  const fitAddon = new FitAddon();
  const searchAddon = new SearchAddon();
  term.loadAddon(fitAddon);
  term.loadAddon(new WebLinksAddon());
  term.loadAddon(searchAddon);

  const el = document.createElement('div');
  el.style.cssText = 'width:100%;height:100%;display:none;';
  el.id = `term-el-${id}`;
  document.getElementById('terminalContainer').appendChild(el);
  term.open(el);

  term.onData((data) => {
    if (ws?.readyState === 1) {
      ws.send(JSON.stringify({ type: 'terminal_input', id, data }));
    }
  });
  term.onResize(({ cols, rows }) => {
    if (ws?.readyState === 1) {
      ws.send(JSON.stringify({ type: 'terminal_resize', id, cols, rows }));
    }
  });

  session.term = term;
  session.fitAddon = fitAddon;
  session.searchAddon = searchAddon;
  session.termEl = el;

  requestAnimationFrame(() => {
    fitAddon.fit();
    const { cols, rows } = term;
    if (ws?.readyState === 1) {
      ws.send(JSON.stringify({ type: 'terminal_create', id, cols, rows }));
    }
  });
}

function destroySessionTerminal(session) {
  if (!session.term) return;
  if (ws?.readyState === 1) {
    ws.send(JSON.stringify({ type: 'terminal_close', id: session.termId }));
  }
  session.term.dispose();
  session.termEl?.remove();
  session.term = null;
  session.fitAddon = null;
  session.termEl = null;
  session.termId = null;
}

function switchTerminalToSession(sessionId) {
  const termPanel = document.getElementById('terminalPanel');
  const monitorPanel = document.getElementById('monitorLogPanel');
  const termNameEl = document.getElementById('termSessionName');
  const monitorNameEl = document.getElementById('monitorSessionName');

  for (const [, s] of sessions) {
    if (s.termEl) s.termEl.style.display = 'none';
  }

  const session = sessions.get(sessionId);
  if (!session) return;

  if (session.isManual) {
    termPanel.style.display = 'flex';
    monitorPanel.classList.remove('visible');
    if (termNameEl) termNameEl.textContent = session.name;
    if (session.termEl) {
      session.termEl.style.display = 'block';
      requestAnimationFrame(() => {
        if (session.fitAddon) session.fitAddon.fit();
        if (session.term) session.term.focus();
      });
    }
  } else {
    termPanel.style.display = 'none';
    monitorPanel.classList.add('visible');
    if (monitorNameEl) monitorNameEl.textContent = session.name;
    renderMonitorLog(session);
  }
}

let manualTabCounter = 0;
async function createManualTab() {
  manualTabCounter++;
  const id = 'manual-' + Date.now();
  const session = new Session(id, `Terminal ${manualTabCounter}`, '');
  session.isManual = true;
  sessions.set(id, session);
  createSessionOffice(session);
  await createSessionTerminal(session);
  switchSession(id);
}

function findSessionByTermId(termId) {
  for (const [, s] of sessions) {
    if (s.termId === termId) return s;
  }
  return null;
}

init();
